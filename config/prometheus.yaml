# Adapted from https://github.com/grafana/tns/blob/main/production/docker-compose/prometheus.yaml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "monitoring/grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "monitoring/prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "monitoring/loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "monitoring/tempo"
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "tns/app"
    static_configs:
      - targets: ["app:80"]

  - job_name: "tns/db"
    always_scrape_classic_histograms: true
    static_configs:
      - targets: ["db:80"]

  - job_name: "tns/loadgen"
    static_configs:
      - targets: ["loadgen:80"]

  - job_name: "monitoring/docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]

  - job_name: "monitoring/node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "monitoring/cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
