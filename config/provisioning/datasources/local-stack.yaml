# Provisioned datasources — all URLs are Docker service names on the compose network.
#
# OpenSearch (sample data from Dashboards → Add sample data):
#   Typical indices: opensearch_dashboards_sample_data_ecommerce, _flights, _logs
#   In Grafana Explore → OpenSearch, set Lucene query e.g. * and pick index / pattern above.
#   Default index pattern below matches all three after sample data is installed.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090/
    access: proxy
    editable: true
    isDefault: true
    jsonData:
      httpMethod: GET
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    version: 1

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: (?:traceID|trace_id)=(\w+)
          url: $${__value.raw}

  - name: Tempo
    type: tempo
    uid: tempo
    # Use host-published port (see docker-compose tempo 8004:3200) + host.docker.internal so
    # Grafana (and Traces Drilldown metrics) always reach Tempo even if in-container DNS for
    # the service name "tempo" fails on 127.0.0.11. Requires extra_hosts on the Grafana service.
    url: http://host.docker.internal:8004
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["job", "instance", "pod", "namespace"]
    version: 1

  - name: OpenSearch
    type: grafana-opensearch-datasource
    uid: opensearch
    access: proxy
    url: http://opensearch:9200
    editable: true
    isDefault: false
    jsonData:
      flavor: opensearch
      version: "2.10.0"
      timeField: "@timestamp"
      # Index pattern after OpenSearch Dashboards "Add sample data" (ecommerce / flights / web logs)
      database: "opensearch_dashboards_sample_data*"
      maxConcurrentShardRequests: 5
    version: 1
