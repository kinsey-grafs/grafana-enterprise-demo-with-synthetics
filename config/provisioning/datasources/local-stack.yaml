# Provisioned datasources — all URLs are Docker service names on the compose network.
#
# OpenSearch sample data (load at http://localhost:5601 → Add sample data):
#   Each datasource pins one index + time field (they differ per dataset).
#   Flights:   opensearch_dashboards_sample_data_flights   → timestamp
#   Ecommerce: opensearch_dashboards_sample_data_ecommerce → order_date
#   Logs:      opensearch_dashboards_sample_data_logs      → @timestamp
#   Index name in provisioning is jsonData.database (not a separate YAML field).
apiVersion: 1

# Remove legacy single "OpenSearch" datasource (uid opensearch) after split into Flights/Ecommerce/Logs.
deleteDatasources:
  - name: OpenSearch
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090/
    access: proxy
    editable: true
    isDefault: true
    jsonData:
      httpMethod: GET
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    version: 1

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: (?:traceID|trace_id)=(\w+)
          url: $${__value.raw}

  - name: Tempo
    type: tempo
    uid: tempo
    # Use host-published port (see docker-compose tempo 8004:3200) + host.docker.internal so
    # Grafana (and Traces Drilldown metrics) always reach Tempo even if in-container DNS for
    # the service name "tempo" fails on 127.0.0.11. Requires extra_hosts on the Grafana service.
    url: http://host.docker.internal:8004
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["job", "instance", "pod", "namespace"]
    version: 1

  # uid opensearch: keep legacy id so existing dashboards/Assistant panels still resolve.
  - name: OpenSearch Flights
    type: grafana-opensearch-datasource
    uid: opensearch
    access: proxy
    url: http://opensearch:9200
    editable: true
    isDefault: false
    jsonData:
      flavor: opensearch
      version: "2.10.0"
      timeField: timestamp
      database: opensearch_dashboards_sample_data_flights
      maxConcurrentShardRequests: 5
    version: 1

  - name: OpenSearch Ecommerce
    type: grafana-opensearch-datasource
    uid: opensearch-ecommerce
    access: proxy
    url: http://opensearch:9200
    editable: true
    isDefault: false
    jsonData:
      flavor: opensearch
      version: "2.10.0"
      timeField: order_date
      database: opensearch_dashboards_sample_data_ecommerce
      maxConcurrentShardRequests: 5
    version: 1

  - name: OpenSearch Logs
    type: grafana-opensearch-datasource
    uid: opensearch-logs
    access: proxy
    url: http://opensearch:9200
    editable: true
    isDefault: false
    jsonData:
      flavor: opensearch
      version: "2.10.0"
      # Use timestamp (logs index also has @timestamp alias → timestamp); avoids YAML edge cases with @
      timeField: timestamp
      database: opensearch_dashboards_sample_data_logs
      maxConcurrentShardRequests: 5
    version: 1
